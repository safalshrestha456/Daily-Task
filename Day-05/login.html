<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Day 05 - Dedicated Responsive Login Page using Tailwind CSS">
  <meta name="author" content="Safal Shrestha">
  <title>Sign In | Tailwind CSS Auth Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8 text-slate-100 antialiased relative selection:bg-blue-600 selection:text-white">

  <!-- Glow effect -->
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-blue-600/15 rounded-full blur-3xl pointer-events-none"></div>

  <div class="sm:mx-auto sm:w-full sm:max-w-md relative z-10 text-center">
    <div class="inline-flex w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 items-center justify-center font-bold text-xl text-white shadow-lg shadow-blue-500/25 mb-4">
      S
    </div>
    <h1 class="text-3xl font-extrabold tracking-tight text-white">Welcome back</h1>
    <p class="mt-2 text-sm text-slate-400">
      Don't have an account yet?
      <a href="register.html" class="font-semibold text-blue-500 hover:text-blue-400 transition">Create an account</a>
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md relative z-10 px-4 sm:px-0">
    <div class="bg-slate-900/85 border border-slate-800 rounded-3xl p-6 sm:p-10 shadow-2xl backdrop-blur-xl">

      <form action="#" method="POST" class="space-y-5" onsubmit="event.preventDefault(); alert('Login validated successfully!');">
        <div>
          <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">Email address</label>
          <div class="relative">
            <input id="email" name="email" type="email" required placeholder="you@example.com" class="w-full px-4 py-2.5 bg-slate-950/70 border border-slate-700/80 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-300">Password</label>
            <a href="#" class="text-xs font-medium text-blue-400 hover:text-blue-300 transition">Forgot password?</a>
          </div>
          <div class="relative">
            <input id="password" name="password" type="password" required placeholder="••••••••" class="w-full px-4 py-2.5 bg-slate-950/70 border border-slate-700/80 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">
          </div>
        </div>

        <div class="flex items-center justify-between text-xs py-1">
          <label class="flex items-center gap-2 cursor-pointer text-slate-400 hover:text-slate-200">
            <input type="checkbox" class="w-4 h-4 rounded border-slate-700 bg-slate-950 text-blue-600 focus:ring-blue-500 focus:ring-offset-slate-900">
            <span>Remember me for 30 days</span>
          </label>
        </div>

        <button type="submit" class="w-full py-3 px-4 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm shadow-lg shadow-blue-600/30 transition active:scale-[0.99]">
          Sign In
        </button>
      </form>

      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-800"></div></div>
        <div class="relative flex justify-center text-xs uppercase"><span class="bg-slate-900 px-3 text-slate-500 font-semibold tracking-wider">Navigation</span></div>
      </div>

      <div class="text-center text-xs text-slate-400 space-x-3">
        <a href="index.html" class="hover:text-white transition">&larr; Auth Hub Portal</a>
        <span>&bull;</span>
        <a href="register.html" class="hover:text-white transition">Register Page &rarr;</a>
      </div>

    </div>
  </div>

  <footer class="mt-8 text-center text-xs text-slate-600">
    Day 05: Tailwind CSS Setup, Utility Classes, Responsive Design & Cards
  </footer>

</body>
</html>
