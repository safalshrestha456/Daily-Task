<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="100%" height="100%">
  <rect width="1000" height="550" fill="#0a0e17"/>
  <!-- Title -->
  <text x="50" y="55" font-family="sans-serif" font-size="24" font-weight="bold" fill="#f8fafc">Sprint Analytics &amp; Health Dashboard</text>
  <text x="50" y="80" font-family="sans-serif" font-size="13" fill="#94a3b8">Real-time velocity and task distribution metrics</text>

  <!-- Big Progress Card -->
  <rect x="50" y="110" width="900" height="110" rx="14" fill="#141e33" stroke="#223252"/>
  <text x="80" y="145" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">Overall Sprint Completion Progress</text>
  <rect x="80" y="165" width="840" height="14" rx="7" fill="#0c1322"/>
  <rect x="80" y="165" width="560" height="14" rx="7" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <text x="80" y="202" font-family="sans-serif" font-size="12" fill="#94a3b8">4 of 6 Tasks Completed</text>
  <text x="880" y="202" font-family="sans-serif" font-size="13" font-weight="bold" fill="#10b981">67% Done</text>

  <!-- Priority Breakdown Card -->
  <rect x="50" y="245" width="435" height="260" rx="14" fill="#141e33" stroke="#223252"/>
  <text x="80" y="280" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">Priority Distribution</text>

  <!-- Urgent Bar -->
  <text x="80" y="325" font-family="sans-serif" font-size="12" fill="#94a3b8">Urgent 🔥</text>
  <rect x="160" y="315" width="250" height="10" rx="5" fill="#0c1322"/>
  <rect x="160" y="315" width="45" height="10" rx="5" fill="#ef4444"/>
  <text x="430" y="325" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">1</text>

  <!-- High Bar -->
  <text x="80" y="365" font-family="sans-serif" font-size="12" fill="#94a3b8">High ⚡</text>
  <rect x="160" y="355" width="250" height="10" rx="5" fill="#0c1322"/>
  <rect x="160" y="355" width="125" height="10" rx="5" fill="#f59e0b"/>
  <text x="430" y="365" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">3</text>

  <!-- Medium Bar -->
  <text x="80" y="405" font-family="sans-serif" font-size="12" fill="#94a3b8">Medium 📌</text>
  <rect x="160" y="395" width="250" height="10" rx="5" fill="#0c1322"/>
  <rect x="160" y="395" width="80" height="10" rx="5" fill="#3b82f6"/>
  <text x="430" y="405" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">2</text>

  <!-- Team Velocity Card -->
  <rect x="515" y="245" width="435" height="260" rx="14" fill="#141e33" stroke="#223252"/>
  <text x="545" y="280" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">Engineering Readiness</text>
  <text x="545" y="325" font-family="sans-serif" font-size="13" fill="#10b981">✓ React 18 SPA Architecture</text>
  <text x="545" y="360" font-family="sans-serif" font-size="13" fill="#10b981">✓ Protected Route Authentication Guards</text>
  <text x="545" y="395" font-family="sans-serif" font-size="13" fill="#10b981">✓ RTL Automated Testing Suite (16/16)</text>
  <text x="545" y="430" font-family="sans-serif" font-size="13" fill="#10b981">✓ Kanban CRUD &amp; Persistence Engine</text>
  <text x="545" y="465" font-family="sans-serif" font-size="13" fill="#f59e0b">⏳ Ready for Backend Integration (FastAPI + GraphQL)</text>
</svg>
