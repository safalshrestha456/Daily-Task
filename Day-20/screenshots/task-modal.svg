<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#0a0e17" fill-opacity="0.9"/>
  <!-- Modal Window -->
  <rect x="150" y="50" width="500" height="500" rx="18" fill="#141e33" stroke="#223252" stroke-width="2"/>
  
  <!-- Header -->
  <text x="180" y="95" font-family="sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">Create New Task</text>
  <text x="610" y="95" font-family="sans-serif" font-size="18" fill="#64748b">✕</text>
  <line x1="150" y1="115" x2="650" y2="115" stroke="#223252"/>

  <!-- Field 1: Title -->
  <text x="180" y="145" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Task Title *</text>
  <rect x="180" y="155" width="440" height="38" rx="8" fill="#0c1322" stroke="#3b82f6"/>
  <text x="195" y="179" font-family="sans-serif" font-size="13" fill="#f8fafc">Integrate GraphQL Task Queries in React</text>

  <!-- Field 2: Description -->
  <text x="180" y="215" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Description</text>
  <rect x="180" y="225" width="440" height="70" rx="8" fill="#0c1322" stroke="#223252"/>
  <text x="195" y="250" font-family="sans-serif" font-size="12" fill="#94a3b8">Use Apollo useQuery and useMutation hooks...</text>

  <!-- Field 3 & 4: Status and Priority -->
  <text x="180" y="320" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Status</text>
  <rect x="180" y="330" width="210" height="38" rx="8" fill="#0c1322" stroke="#223252"/>
  <text x="195" y="354" font-family="sans-serif" font-size="13" fill="#f8fafc">In Progress</text>

  <text x="410" y="320" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Priority</text>
  <rect x="410" y="330" width="210" height="38" rx="8" fill="#0c1322" stroke="#223252"/>
  <text x="425" y="354" font-family="sans-serif" font-size="13" fill="#ef4444">Urgent 🔥</text>

  <!-- Field 5 & 6: Due Date and Assignee -->
  <text x="180" y="395" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Due Date</text>
  <rect x="180" y="405" width="210" height="38" rx="8" fill="#0c1322" stroke="#223252"/>
  <text x="195" y="429" font-family="sans-serif" font-size="13" fill="#f8fafc">2026-11-28</text>

  <text x="410" y="395" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Assigned Engineer</text>
  <rect x="410" y="405" width="210" height="38" rx="8" fill="#0c1322" stroke="#223252"/>
  <text x="425" y="429" font-family="sans-serif" font-size="13" fill="#f8fafc">Safal Shrestha</text>

  <!-- Buttons -->
  <rect x="420" y="475" width="90" height="38" rx="8" fill="transparent" stroke="#223252"/>
  <text x="445" y="499" font-family="sans-serif" font-size="13" fill="#94a3b8">Cancel</text>
  <rect x="520" y="475" width="100" height="38" rx="8" fill="#3b82f6"/>
  <text x="540" y="499" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Create Task</text>
</svg>
